# Ambiente local completo: infraestrutura + 11 serviços.
#   cp .env.example .env
#   docker compose up -d --build
# Gateway: http://localhost:8080 · RabbitMQ: http://localhost:15672 · Grafana: http://localhost:3000
# Jaeger: http://localhost:16686 · Prometheus: http://localhost:9090 · E-mails (Mailpit): http://localhost:8025

name: hub-registro

x-service: &service
  restart: unless-stopped
  mem_limit: 768m
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  environment: &service-env
    AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
    TRACING_ENABLED: "true"
    OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+: o volume é montado no diretório pai (os dados ficam em /var/lib/postgresql/18/docker)
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = 'hub_operations'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.1-management-alpine}
    restart: unless-stopped
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.27}
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/jaeger:2.9.0}
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4318:4318"

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.1}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev}
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger

  api-gateway:
    <<: *service
    build:
      context: .
      args:
        SERVICE: api-gateway
    image: hub-registro/api-gateway:dev
    depends_on:
      - redis
      - auth-service
      - bank-service
      - registry-service
      - contract-service
      - document-service
      - routing-service
      - integration-service
      - notification-service
      - audit-service
      - operations-service
    ports:
      - "8080:8080"
    environment:
      <<: *service-env
      REDIS_HOST: redis
      HUB_CORS_ALLOWED_ORIGINS: ${HUB_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      AUTH_SERVICE_URL: http://auth-service:8081
      BANK_SERVICE_URL: http://bank-service:8082
      REGISTRY_SERVICE_URL: http://registry-service:8083
      CONTRACT_SERVICE_URL: http://contract-service:8084
      DOCUMENT_SERVICE_URL: http://document-service:8085
      ROUTING_SERVICE_URL: http://routing-service:8086
      INTEGRATION_SERVICE_URL: http://integration-service:8087
      NOTIFICATION_SERVICE_URL: http://notification-service:8088
      AUDIT_SERVICE_URL: http://audit-service:8089
      OPERATIONS_SERVICE_URL: http://operations-service:8090

  auth-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: auth-service
    image: hub-registro/auth-service:dev
    ports:
      - "8081:8081"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/hub_auth
      DB_USERNAME: hub_auth
      DB_PASSWORD: ${HUB_AUTH_DB_PASSWORD:-hub_auth}
      HUB_AUTH_ENCRYPTION_KEY: ${HUB_AUTH_ENCRYPTION_KEY:?defina HUB_AUTH_ENCRYPTION_KEY no .env}
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-default,dev}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      HUB_PORTAL_URL: ${HUB_PORTAL_URL:-http://localhost:4200}
      HUB_AUTH_BOOTSTRAP_ADMIN_EMAIL: ${HUB_AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      HUB_AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${HUB_AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}

  bank-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: bank-service
    image: hub-registro/bank-service:dev
    ports:
      - "8082:8082"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/hub_bank
      DB_USERNAME: hub_bank
      DB_PASSWORD: ${HUB_BANK_DB_PASSWORD:-hub_bank}

  registry-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: registry-service
    image: hub-registro/registry-service:dev
    ports:
      - "8083:8083"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/hub_registry
      DB_USERNAME: hub_registry
      DB_PASSWORD: ${HUB_REGISTRY_DB_PASSWORD:-hub_registry}

  contract-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: contract-service
    image: hub-registro/contract-service:dev
    ports:
      - "8084:8084"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/hub_contract
      DB_USERNAME: hub_contract
      DB_PASSWORD: ${HUB_CONTRACT_DB_PASSWORD:-hub_contract}

  document-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: document-service
    image: hub-registro/document-service:dev
    ports:
      - "8085:8085"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/hub_document
      DB_USERNAME: hub_document
      DB_PASSWORD: ${HUB_DOCUMENT_DB_PASSWORD:-hub_document}

  routing-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: routing-service
    image: hub-registro/routing-service:dev
    ports:
      - "8086:8086"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/hub_routing
      DB_USERNAME: hub_routing
      DB_PASSWORD: ${HUB_ROUTING_DB_PASSWORD:-hub_routing}

  integration-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: integration-service
    image: hub-registro/integration-service:dev
    ports:
      - "8087:8087"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/hub_integration
      DB_USERNAME: hub_integration
      DB_PASSWORD: ${HUB_INTEGRATION_DB_PASSWORD:-hub_integration}

  notification-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: notification-service
    image: hub-registro/notification-service:dev
    ports:
      - "8088:8088"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/hub_notification
      DB_USERNAME: hub_notification
      DB_PASSWORD: ${HUB_NOTIFICATION_DB_PASSWORD:-hub_notification}

  audit-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: audit-service
    image: hub-registro/audit-service:dev
    ports:
      - "8089:8089"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/hub_audit
      DB_USERNAME: hub_audit
      DB_PASSWORD: ${HUB_AUDIT_DB_PASSWORD:-hub_audit}

  operations-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: operations-service
    image: hub-registro/operations-service:dev
    ports:
      - "8090:8090"
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/hub_operations
      DB_USERNAME: hub_operations
      DB_PASSWORD: ${HUB_OPERATIONS_DB_PASSWORD:-hub_operations}

volumes:
  postgres-data:
  rabbitmq-data:
