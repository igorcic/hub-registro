global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: hub-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - auth-service:8081
          - bank-service:8082
          - registry-service:8083
          - contract-service:8084
          - document-service:8085
          - routing-service:8086
          - integration-service:8087
          - notification-service:8088
          - audit-service:8089
          - operations-service:8090

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
