spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}
          issuer-uri: https://auth.hub-registro.local
          audiences: hub-registro
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/api-clients/**,/oauth2/token
            - id: bank-service
              uri: ${BANK_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/banks/**
            - id: registry-service
              uri: ${REGISTRY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/registries/**
            - id: contract-service
              uri: ${CONTRACT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/contracts/**
            - id: document-service
              uri: ${DOCUMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/documents/**
            - id: routing-service
              uri: ${ROUTING_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/routing-rules/**
            - id: integration-service
              uri: ${INTEGRATION_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/integrations/**,/api/v1/webhooks/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/notifications/**
            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/audit/**
            - id: operations-service
              uri: ${OPERATIONS_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/v1/operations/**,/api/v1/reports/**,/api/v1/dashboards/**

hub:
  gateway:
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /api/v1/auth/password-reset/**
      - /oauth2/token
      # Webhooks das registradoras: autenticados por assinatura HMAC no integration-service
      - /api/v1/webhooks/**
    cors-allowed-origins: ${HUB_CORS_ALLOWED_ORIGINS:http://localhost:4200}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      user-per-minute: 300
      anonymous-per-minute: 30

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      # Redis fora do ar desliga só o limitador (falha aberta), não o gateway.
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
