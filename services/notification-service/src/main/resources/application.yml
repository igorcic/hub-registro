spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hub_notification}
    username: ${DB_USERNAME:hub_notification}
    password: ${DB_PASSWORD:hub_notification}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          # Chaves públicas do auth-service; o issuer e a audiência são conferidos em todo token.
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}
          issuer-uri: https://auth.hub-registro.local
          audiences: hub-registro
  threads:
    virtual:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hub_app}
    password: ${RABBITMQ_PASSWORD:hub_app_dev}
    virtual-host: ${RABBITMQ_VHOST:hub}
    # Relay do Outbox: só marca como publicado o que o broker confirmou e roteou.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
    rabbit:
      # Com o Outbox, broker fora do ar só atrasa a publicação: não tira o serviço do ar.
      enabled: false
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
